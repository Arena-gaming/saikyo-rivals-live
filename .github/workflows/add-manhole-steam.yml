name: Add manhole steam animation

on:
  push:
    paths:
      - '.github/workflows/add-manhole-steam.yml'

permissions:
  contents: write

jobs:
  patch-landing-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add steam animation without changing layout or artwork
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          css = '''
          .manhole-steam{position:absolute;left:64.1%;top:73.5%;width:11%;height:18%;z-index:7;pointer-events:none;overflow:visible;filter:blur(.2px)}
          .steam-wisp{position:absolute;bottom:0;left:50%;width:32%;height:70%;opacity:0;border-radius:50%;background:radial-gradient(ellipse at 50% 75%,rgba(220,232,236,.24) 0%,rgba(202,218,224,.14) 30%,rgba(185,204,211,.06) 52%,transparent 74%);filter:blur(7px);mix-blend-mode:screen;transform-origin:50% 100%;will-change:transform,opacity}
          .steam-wisp.s1{margin-left:-28%;animation:steamRiseA 5.8s ease-out infinite}
          .steam-wisp.s2{margin-left:-4%;width:27%;height:62%;animation:steamRiseB 6.7s 1.8s ease-out infinite}
          .steam-wisp.s3{margin-left:-40%;width:24%;height:58%;animation:steamRiseC 7.4s 3.7s ease-out infinite}
          @keyframes steamRiseA{0%,12%{opacity:0;transform:translate3d(0,8%,0) scale(.62,.45)}22%{opacity:.34}62%{opacity:.18;transform:translate3d(-18%,-48%,0) scale(1.05,1.3)}100%{opacity:0;transform:translate3d(18%,-108%,0) scale(1.45,1.8)}}
          @keyframes steamRiseB{0%,10%{opacity:0;transform:translate3d(0,10%,0) scale(.55,.42)}24%{opacity:.28}64%{opacity:.16;transform:translate3d(22%,-52%,0) scale(1.08,1.34)}100%{opacity:0;transform:translate3d(-12%,-112%,0) scale(1.5,1.9)}}
          @keyframes steamRiseC{0%,14%{opacity:0;transform:translate3d(0,8%,0) scale(.58,.44)}28%{opacity:.24}66%{opacity:.14;transform:translate3d(-12%,-46%,0) scale(1.02,1.28)}100%{opacity:0;transform:translate3d(24%,-102%,0) scale(1.42,1.76)}}
          @media(prefers-reduced-motion:reduce){.steam-wisp{animation:none!important;opacity:.08}}
          '''
          html = '<div class="manhole-steam" aria-hidden="true"><i class="steam-wisp s1"></i><i class="steam-wisp s2"></i><i class="steam-wisp s3"></i></div>\n'
          if '.manhole-steam{' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          if 'class="manhole-steam"' not in s:
              marker = '<canvas id="rainCanvas" class="rain-canvas" aria-hidden="true"></canvas>'
              if marker not in s:
                  raise SystemExit('rain canvas marker not found; refusing unsafe patch')
              s = s.replace(marker, html + marker, 1)
          p.write_text(s)
          PY
          python3 /tmp/patch.py
      - name: Commit landing-page change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add subtle steam rising from manhole'
          git push
