name: Wire isolated smoke animation

on:
  push:
    paths:
      - '.github/workflows/add-manhole-steam.yml'

permissions:
  contents: write

jobs:
  patch-landing-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link isolated smoke stylesheet only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='</head>'
          link='<link rel="stylesheet" href="smoke-v2.css">\n'
          if link not in s:
              if marker not in s: raise SystemExit('head marker missing; refusing patch')
              s=s.replace(marker,link+marker,1)
          p.write_text(s)
          PY
      - name: Verify rain code remains untouched
        run: |
          grep -q "const rain=document.getElementById('rainCanvas')" index.html
          grep -q "requestAnimationFrame(frame)" index.html
          grep -q 'smoke-v2.css' index.html
      - name: Commit branch-only change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load isolated natural steam animation'
          git push
