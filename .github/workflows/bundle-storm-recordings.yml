name: Bundle storm recordings (temporary)
on:
  push:
    branches: [recorded-storm-audible-cues]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and verify public-domain recordings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p '.'
          download() {
            local title="$1" target="$2" digest url
            digest=$(printf '%s' "$title" | md5sum | cut -c1-32)
            url="https://upload.wikimedia.org/wikipedia/commons/${digest:0:1}/${digest:0:2}/$title"
            curl --fail --location --retry 3 --max-time 45 --user-agent 'SaikyoRivalsBuild/1.0 (public-domain Wikimedia Commons)' "$url" -o "$target"
            test "$(head -c 4 "$target")" = "OggS"
            test "$(stat -c%s "$target")" -gt 150000
          }
          download 'Rain_(1).ogg' 'storm-rain.ogg'
          download 'Rain_and_thunder.ogg' 'storm-thunder.ogg'
      - name: Commit verified files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'storm-rain.ogg' 'storm-thunder.ogg'
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle CC0 storm recordings for reliable local playback [skip ci]'
            git push
          fi
