name: Prepare licensed neon recording (temporary)
on:
  push:
    branches: [neon-recorded-sputter-v6]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Retrieve CC0 neon field recording and encode Ogg
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,re,html,json
          u='https://freesound.org/people/bolkmar/sounds/500693/'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          page=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
          page=html.unescape(page).replace(r'\u002F','/').replace(r'\/','/')
          candidates=re.findall(r'https?://[^\s"<>]+?/(?:data/)?previews/[^\s"<>]+?\.(?:mp3|ogg)',page)
          candidates+=re.findall(r'https?://[^\s"<>]+?500693[^\s"<>]+?\.mp3',page)
          candidates=list(dict.fromkeys(v.replace('\\','') for v in candidates))
          print('Detected candidate count:',len(candidates))
          good=None
          for u in candidates:
            if '500693' not in u: continue
            if 'hq.' in u or 'hq-' in u: good=u; break
            good=u
          if not good: raise RuntimeError('no verifiable audio preview in CC0 source; refusing substitute')
          request=urllib.request.Request(good,headers={'User-Agent':'Mozilla/5.0'})
          data=urllib.request.urlopen(request,timeout=30).read()
          if len(data)<10000: raise RuntimeError('preview incomplete')
          open('neon-input.mp3','wb').write(data)
          print('Verified licensed source preview bytes:',len(data))
          PY
          python3 -m pip install --quiet --break-system-packages imageio-ffmpeg
          FFMPEG=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          "$FFMPEG" -nostdin -hide_banner -loglevel error -y -i neon-input.mp3 -af 'highpass=f=160,lowpass=f=6500,loudnorm=I=-17:TP=-2:LRA=7' -ar 44100 -ac 1 -c:a libvorbis -q:a 5 neon-flicker.ogg
          test "$(head -c4 neon-flicker.ogg)" = OggS
          test "$(stat -c%s neon-flicker.ogg)" -gt 12000
          rm neon-input.mp3
      - name: Commit approved sound recording
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add neon-flicker.ogg
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle CC0 recorded neon flickering sample [skip ci]'
            git push
          fi
