name: Validate landing page

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check ambient.js
          node --check smoke.js
      - name: Verify landing assets
        run: |
          grep -q 'hero-bg.jpg' index.html
          grep -q 'wordmark.png' index.html
          grep -q 'ambient.css' index.html
          grep -q 'ambient.js' index.html
          grep -q 'ambientSoundToggle' index.html
      - name: Enforce pre-launch Home and Contact only
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const home = fs.readFileSync('index.html','utf8');
          const nav = home.match(/<nav\b[^>]*>([\s\S]*?)<\/nav>/);
          if (!nav) throw Error('Missing Home navigation');
          const labels = [...nav[1].matchAll(/<a\b[^>]*>(.*?)<\/a>/g)].map(m => m[1].replace(/<[^>]+>/g,'').trim());
          if (JSON.stringify(labels) !== JSON.stringify(['Home','Contact'])) throw Error('Only Home and Contact may appear in navigation: '+labels.join(', '));
          if (/id=["']features["']/.test(home)) throw Error('Pre-launch Features section must not appear');
          const about = fs.readFileSync('about.html','utf8');
          if (!about.includes('noindex,nofollow') || !about.includes('location.replace("/")')) throw Error('About must redirect to Home');
          const contact = fs.readFileSync('contact.html','utf8');
          if (!contact.includes('GET IN TOUCH') || !contact.includes('aria-current="page">Contact')) throw Error('Contact must be public');
          // A separate, substantial destination photo must exist locally.
          const image = fs.readFileSync('contact-alley.jpg');
          if (image.length < 80000 || image[0] !== 0xff || image[1] !== 0xd8) throw Error('Contact alley photograph is absent or invalid');
          if (!contact.includes("contact-backdrop") || !contact.includes("/contact-alley.jpg")) throw Error('Contact background must visibly render the alley');
          if (!home.includes("contact-arrival") || !home.includes("/contact-alley.jpg")) throw Error('Home travel must hand off to the actual alley image');
          if (!contact.includes('class="contact-grade"') || !contact.includes('class="contact-backdrop"')) throw Error('Contact artwork must sit above the page background');
          const sitemap = fs.readFileSync('sitemap.xml','utf8');
          if (/about\.html/.test(sitemap) || !/contact\.html/.test(sitemap)) throw Error('Only Home and Contact belong in public sitemap');
          NODE
