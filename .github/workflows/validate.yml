name: Validate landing page

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check ambient.js
          node --check smoke.js
      - name: Verify landing assets
        run: |
          grep -q 'hero-bg.jpg' index.html
          grep -q 'wordmark.png' index.html
          grep -q 'ambient.css' index.html
          grep -q 'ambient.js' index.html
          grep -q 'ambientSoundToggle' index.html
      - name: Enforce pre-launch Home-only site
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const home = fs.readFileSync('index.html','utf8');
          const nav = home.match(/<nav\b[^>]*>([\s\S]*?)<\/nav>/);
          if (!nav) throw Error('Missing Home navigation');
          const labels = [...nav[1].matchAll(/<a\b[^>]*>(.*?)<\/a>/g)].map(m => m[1].replace(/<[^>]+>/g,'').trim());
          if (JSON.stringify(labels) !== JSON.stringify(['Home'])) throw Error('Only Home may appear in navigation: '+labels.join(', '));
          if (/id=["']features["']/.test(home)) throw Error('Pre-launch Features section must not appear');
          for (const file of ['about.html', 'contact.html']) {
            const page = fs.readFileSync(file,'utf8');
            if (!page.includes('noindex,nofollow') || !page.includes('location.replace("/")')) throw Error(file+' must redirect to Home');
          }
          const sitemap = fs.readFileSync('sitemap.xml','utf8');
          if (/about\.html|contact\.html/.test(sitemap)) throw Error('Only Home belongs in public sitemap');
          NODE
