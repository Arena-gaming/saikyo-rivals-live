name: Validate landing page

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check ambient.js
          node --check smoke.js
      - name: Verify landing assets
        run: |
          grep -q 'hero-bg.jpg' index.html
          grep -q 'wordmark.png' index.html
          grep -q 'ambient.css' index.html
          grep -q 'ambient.js' index.html
          grep -q 'ambientSoundToggle' index.html
      - name: Enforce pre-launch Home and Contact only
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const home = fs.readFileSync('index.html','utf8');
          const nav = home.match(/<nav\b[^>]*>([\s\S]*?)<\/nav>/);
          if (!nav) throw Error('Missing Home navigation');
          const labels = [...nav[1].matchAll(/<a\b[^>]*>(.*?)<\/a>/g)].map(m => m[1].replace(/<[^>]+>/g,'').trim());
          if (JSON.stringify(labels) !== JSON.stringify(['Home','Contact'])) throw Error('Only Home and Contact may appear in navigation: '+labels.join(', '));
          if (/id=["']features["']/.test(home)) throw Error('Pre-launch Features section must not appear');
          const about = fs.readFileSync('about.html','utf8');
          if (!about.includes('noindex,nofollow') || !about.includes('location.replace("/")')) throw Error('About must redirect to Home');
          const contact = fs.readFileSync('contact.html','utf8');
          if (!contact.includes('CONTACT SAIKYO') || !contact.includes('aria-current="page">Contact')) throw Error('Contact must be public');
          const image = fs.readFileSync('contact-approved.webp');
          if (image.length < 140000 || image.toString('ascii',0,4) !== 'RIFF' || image.toString('ascii',8,12) !== 'WEBP') throw Error('Approved generated Contact artwork missing or truncated');
          if (!contact.includes('class="contact-art"') || !contact.includes('/contact-approved.webp')) throw Error('Contact must render the user-approved exact artwork');
          if (!home.includes('contact-arrival') || !home.includes('/contact-approved.webp')) throw Error('Home must hand off into that exact artwork');
          if (!contact.includes('id="contactForm"') || !contact.includes('mailto:hello@saikyo-rivals.com')) throw Error('Enquiry email-draft form missing');
          if (!contact.includes('https://x.com/saikyorivals') || !contact.includes('https://instagram.com/saikyorivals')) throw Error('Actual live contact links missing');
          const sitemap = fs.readFileSync('sitemap.xml','utf8');
          if (/about\.html/.test(sitemap) || !/contact\.html/.test(sitemap)) throw Error('Only Home and Contact belong in public sitemap');
          NODE
